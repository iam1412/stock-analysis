# Canary รายสัปดาห์: ตรวจว่าทุก symbol ใน reports/ ยัง "มีตัวตนบนกระดาน" อยู่จริง
# เหตุเกิด 8 ส.ค. 2569: EA (ปิดดีล take-private) กับ BPP (ควบบริษัทกับ BANPU) ถูกเพิกถอนไปแล้ว
# แต่ Yahoo ยัง serve ราคาปิดวันสุดท้ายค้างไปเรื่อย ๆ ⇒ cron ราคาเห็น drift 0% ⇒ ไม่มี flag
# ⇒ รายงานอ้างราคาหุ้นที่เลิกซื้อขายแล้วได้ไม่จำกัด — จุดบอดเชิงโครงสร้าง ไม่ใช่ bug รายตัว
# ตัวนี้ถาม TradingView scanner (แหล่งอิสระที่ ticker ตาย = "หายจากผลลัพธ์" ไม่ใช่ค้างราคา)
# deterministic ล้วน ไม่มี LLM · รายละเอียด: docs/price-refresh.md §Canary หุ้นหยุดเทรด/เพิกถอน
name: dead-ticker-canary

on:
  schedule:
    - cron: '23 2 * * 1' # จันทร์ 02:23 UTC = 09:23 น. ไทย (หลัง price-refresh ของเช้านั้น)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write   # อัปเดต issue คิว re-analysis เอง — ไม่รอ price-refresh เช้าวันถัดไป

concurrency:
  # กลุ่มเดียวกับ update-prices.yml (ไม่ใช่ชื่อ workflow ตัวเอง) — เหตุผลเต็มอยู่ที่นั่น: ทั้งคู่แก้ไข
  # issue คิวใบเดียวกันแบบไม่มี lock ต้อง serialize ข้าม workflow กัน ⇒ canary เช้าวันจันทร์ต่อคิว
  # รอ price-refresh รอบยาวจบก่อน (trade-off ที่ตั้งใจ ดีกว่า cancel-in-progress กลางคัน)
  group: price-flags-issue
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Unit test ตัวแคนารี (offline — canary ของ canary)
        run: npm run test:dead

      - name: ถาม TradingView ว่า ticker ยังอยู่บนกระดานไหม
        run: node tools/dead-ticker-canary.js --write

      - name: Commit + push (เฉพาะเมื่อ flag/cache เปลี่ยน)
        id: commit_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-flags.json tools/tv-tickers.json
          if git diff --cached --quiet; then echo "ไม่มีอะไรเปลี่ยน — ข้าม commit"; exit 0; fi
          n=$(node -e 'try{console.log(require("./price-flags.json").filter(f=>f.reason==="not-on-exchange").length)}catch(e){console.log(0)}')
          git commit -m "canary: ตรวจ ticker บนกระดาน — not-on-exchange ${n} ตัว ($(TZ=Asia/Bangkok date +%Y-%m-%d))"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push ชนกับ session อื่น — retry ($i/3)"
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          echo "push ไม่สำเร็จหลัง retry 3 รอบ — รอบหน้าจัดการเอง"
          exit 1

      # flag ที่ canary เขียนคือ reason ที่ต้องรีบที่สุด (triage = ยืนยันแล้วลบรายงาน) แต่ issue คิว
      # ถูกเขียนโดย workflow price-refresh เท่านั้น ⇒ flag เช้าวันจันทร์จะไม่โผล่ในคิวจนถึงเช้าวันอังคาร
      # (~22 ชม.) เหลือแค่ job summary ที่ไม่มีใครเปิดดู — จึงอัปเดต issue ใบเดียวกันเองตรงนี้
      # ตรรกะเดียวกับ update-prices.yml เป๊ะ (ใบเดียว หัวเรื่องเดียว body สร้างจาก flags-issue-body.js)
      - name: อัปเดต issue คิว re-analysis (price-flags)
        # อัปเดตเฉพาะตอน push จริงถึง main แล้ว (หรือไม่มีอะไรเปลี่ยน = tree ตรง main อยู่แล้ว) — เช็คจาก
        # outcome ของ step commit_push เท่านั้น กัน issue โกหกว่าคิวเคลียร์ทั้งที่ commit ยัง skip/fail อยู่
        if: always() && steps.commit_push.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Price-refresh flags — หุ้นรอ re-analysis"
          num=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || echo "")
          count=$(node -e 'try{console.log(require("./price-flags.json").length)}catch(e){console.log(0)}')
          if [ "$count" = "0" ]; then
            if [ -n "$num" ]; then gh issue close "$num" --comment "คิวเคลียร์หมดแล้ว ✅ (ปิดอัตโนมัติโดย dead-ticker-canary)"; fi
            exit 0
          fi
          prev=""
          if [ -n "$num" ]; then prev=$(gh issue view "$num" --json body --jq .body); fi
          body=$(PREV_BODY="$prev" TODAY="$(TZ=Asia/Bangkok date +%F)" node tools/flags-issue-body.js)
          if [ -n "$num" ]; then
            gh issue edit "$num" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
